<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google fonts -->
    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <!-- DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- [Lucide] Icons CDN-->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
    <title>{% block title %}Netwatch{% endblock %}</title>
  </head>
  <body class="bg-gray-100">
    <!-- Modal for logs history -->
    <dialog
      id="logs-modal"
      class="m-0 ml-auto max-w-107.5 w-full min-h-full bg-white shadow-2xl shadow-black/50 backdrop:bg-black/50 backdrop:backdrop-blur-sm"
    ></dialog>
    <!-- Modal for add a device -->
    <dialog
      id="add-modal"
      class="m-auto max-w-122.5 w-full bg-white rounded-2xl shadow-2xl shadow-black/50 backdrop:bg-black/50 backdrop:backdrop-blur-sm"
    ></dialog>
    <main class="flex flex-col min-h-dvh md:h-dvh">
      <!-- Header -->
      <header class="bg-white flex items-center h-18">
        <div class="container mx-auto px-4 sm:p-0">
          <div class="flex justify-between gap-4">
            <div class="inline-flex items-center gap-3">
              <a
                href="/"
                class="w-8 h-8 inline-flex items-center justify-center rounded-lg bg-teal-900 text-teal-300 font-bold"
              >
                <i data-lucide="eye"></i>
              </a>
              <span class="hidden font-bold md:block">Netwatch</span>
            </div>
            {% if user %}
            <a
              href="/logout"
              type="button"
              class="bg-white border border-gray-300 inline-flex items-center justify-center font-semibold px-3.5 py-2 cursor-pointer rounded-lg hover:border-gray-400 transition-colors text-[0.8125rem]"
            >
              Log out
            </a>
            {% endif %}
          </div>
        </div>
      </header>

      <!-- Main content -->
      <div class="flex-1 container mx-auto px-4 pt-7.5 pb-12.5 sm:pt-7.5">
        {% block content %} {% endblock %}
      </div>
    </main>
  </body>

  <!-- HTMX CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous"
  ></script>
  <script>
    lucide.createIcons();

    function formatLocalTime(root = document) {
      root.querySelectorAll(".local-time").forEach((el) => {
        const isoString = el.getAttribute("datetime");
        if (!isoString) return;

        const date = new Date(isoString);
        el.textContent = date.toLocaleString([], {
          dateStyle: "short",
          timeStyle: "short",
        });
      });
    }

    htmx.onLoad(function () {
      lucide.createIcons();
      formatLocalTime();
    });

    // Close modal when clicking on the backdrop of dialog element
    const modal = document.getElementById("logs-modal");
    modal.addEventListener("click", (el) => {
      if (el.target == modal) return modal.close();
    });

    const addModal = document.getElementById("add-modal");
    addModal.addEventListener("click", (el) => {
      if (el.target == addModal) return addModal.close();
    });

    document.body.addEventListener("device-created", () => {
      addModal.close();
    });
  </script>
</html>
